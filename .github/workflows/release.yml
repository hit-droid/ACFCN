name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble release APK (validates R8 rules)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ACFCN_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/acfcn.jks"
          echo "path=$RUNNER_TEMP/acfcn.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        if: steps.keystore.outputs.path != ''
        env:
          ACFCN_KEYSTORE: ${{ steps.keystore.outputs.path }}
          ACFCN_STORE_PASSWORD: ${{ secrets.ACFCN_STORE_PASSWORD }}
          ACFCN_KEY_ALIAS: ${{ secrets.ACFCN_KEY_ALIAS }}
          ACFCN_KEY_PASSWORD: ${{ secrets.ACFCN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Attach APKs to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          name: ACFCN ${{ github.ref_name }}
          draft: false
          prerelease: false
