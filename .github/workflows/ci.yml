name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build the Adreno OpenCL backend. Requires the OpenCL headers + ICD
      # loader staged below; keeps GPU offload validated on every push.
      ACFCN_OPENCL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null

      - name: Stage OpenCL headers & ICD loader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          # Pin the NDK to the version in app/build.gradle.kts; the runner has
          # other NDK versions preinstalled and the script would otherwise pick
          # the newest one, staging headers into a sysroot the build never uses.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          bash scripts/setup-opencl-ndk.sh arm64-v8a

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        # includeRobolectric: the build excludes Robolectric tests locally
        # (SDK artifact downloads stall); CI is where the full suite runs.
        run: ./gradlew :app:testDebugUnitTest --no-daemon -PincludeRobolectric=true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble release APK (validates R8 rules)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
